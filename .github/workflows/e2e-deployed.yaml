name: E2E deployed

# Runs the examples smoke suite against the Vercel deployment for this commit.
#
# Vercel's git integration creates a GitHub deployment for every push and fires
# `deployment_status` when it finishes, with the URL in `environment_url`. That
# is why this is a separate workflow from ci.yaml: the preview does not exist
# yet when a `pull_request` run starts, so there is nothing to test at that
# point. Waiting for it inside ci.yaml means polling the Vercel API with a
# token, which this avoids entirely.
#
# It fires for previews and for production, so a PR is tested before merge and
# the live site is tested again after.
on: deployment_status

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  examples:
    # Only successful deployments have a URL worth testing. `deployment_status`
    # also fires for `pending`, `error` and `failure`.
    if: ${{ github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '' }}
    runs-on: ubuntu-latest
    steps:
      # `deployment_status` checks out the commit that was deployed, so the
      # tests always match the code running at the URL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm playwright install --with-deps chromium
      - name: Run the examples suite against the deployment
        run: pnpm test:e2e:deployed
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # Preview deployments are behind Vercel Authentication. This is the
          # project's Protection Bypass for Automation secret, so CI can reach
          # them without making previews public.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-deployed
          path: playwright-report/
          retention-days: 7
