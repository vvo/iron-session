name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag. Use "beta" for prereleases, "latest" only for a stable release.'
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      dry-run:
        description: "Pack and run every check, but do not publish."
        required: false
        default: false
        type: boolean

# `id-token: write` is what npm's trusted publishing exchanges for a short-lived
# publish token, and what lets npm attach a provenance statement so anyone can
# verify a tarball was built from this repository at this commit. There is no
# NPM_TOKEN on purpose: see AGENTS.md.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No `registry-url` here on purpose. It makes setup-node write an
      # `_authToken` line into .npmrc, and a statically configured token used to
      # make pnpm skip the OIDC exchange entirely, publishing without provenance.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Publishing something that does not pass its own gates is how a bad
      # release happens, so run them here too rather than trusting that CI ran.
      - name: Verify
        run: |
          pnpm format:check
          pnpm oxlint --type-aware
          pnpm tsc --noEmit
          pnpm test
          pnpm build
          pnpm publint
          pnpm attw --pack . --ignore-rules cjs-resolves-to-esm
          pnpm size
          pnpm lint:types

      - name: Guard the dist-tag against the version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version tag=${{ inputs.tag }}"
          case "$version" in
            *-*)
              if [ "${{ inputs.tag }}" = "latest" ]; then
                echo "::error::$version is a prerelease and must not be published as 'latest'."
                exit 1
              fi
              ;;
            *)
              if [ "${{ inputs.tag }}" = "beta" ]; then
                echo "::notice::$version is stable but is being published under 'beta'."
              fi
              ;;
          esac

      - name: Refuse to republish a version that is already on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "iron-session@$version" version > /dev/null 2>&1; then
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "::warning::iron-session@$version is already published. A real release would fail here."
            else
              echo "::error::iron-session@$version is already published. Bump the version instead."
              exit 1
            fi
          fi

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm publish --tag ${{ inputs.tag }} --provenance --no-git-checks --access public

      # The failure we care about is publishing without provenance, which looks
      # exactly like a success. Ask the registry what it actually stored.
      #
      # A new version takes a while to show up in the packument: on 9.0.1 it was
      # 80s, so poll for 5 minutes. Query registry.npmjs.org directly rather than
      # via `npm view`, which reads whatever registry is configured and caches.
      - name: Verify the published version has provenance
        if: ${{ !inputs.dry-run }}
        run: |
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            url=$(curl -sf -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/iron-session/$version" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).dist?.attestations?.url??"")}catch{}})' \
              || true)
            if [ -n "$url" ]; then
              echo "::notice::iron-session@$version published with provenance: $url"
              exit 0
            fi
            echo "attempt $i: no attestation yet, waiting"
            sleep 10
          done
          echo "::error::iron-session@$version has no provenance attestation after 5 minutes. Check the trusted publisher config on npmjs.com."
          exit 1

      - name: Pack only (dry run)
        if: ${{ inputs.dry-run }}
        run: pnpm pack
