name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag. Use "beta" for prereleases, "latest" only for a stable release.'
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      dry-run:
        description: "Pack and run every check, but do not publish."
        required: false
        default: false
        type: boolean

# Publishes with npm trusted publishing: the `publish` job exchanges a GitHub
# OIDC token (`id-token: write`) for a short-lived publish credential. There is
# no NPM_TOKEN on purpose: see AGENTS.md. Starting this workflow is the approval.
#
# The job holding `id-token: write` installs no dependencies. It only runs Node
# and npm on the tarball the `build` job packed, so a compromised dev
# dependency never sees a token that can publish a release.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false # never cache in a release build

      # No install script is needed: esbuild's postinstall only re-checks the
      # binary its platform package already ships, and unrs-resolver is not in
      # the lockfile anymore.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Staging something that does not pass its own gates is how a bad
      # release happens, so run them here too rather than trusting that CI ran.
      - name: Verify
        run: |
          pnpm format:check
          pnpm oxlint --type-aware
          pnpm tsc --noEmit
          pnpm test
          pnpm build
          pnpm publint
          pnpm attw --pack . --ignore-rules cjs-resolves-to-esm
          pnpm size
          pnpm lint:types

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Guard the dist-tag against the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "version=$VERSION tag=$TAG"
          case "$VERSION" in
            *-*)
              if [ "$TAG" = "latest" ]; then
                echo "::error::$VERSION is a prerelease and must not be published as 'latest'."
                exit 1
              fi
              ;;
            *)
              if [ "$TAG" = "beta" ]; then
                echo "::notice::$VERSION is stable but is being published under 'beta'."
              fi
              ;;
          esac

      - name: Refuse to republish a version that is already on npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if npm view "iron-session@$VERSION" version > /dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::iron-session@$VERSION is already published. A real release would fail here."
            else
              echo "::error::iron-session@$VERSION is already published. Bump the version instead."
              exit 1
            fi
          fi

      # pnpm, not npm, so workspace and catalog protocols resolve in the tarball.
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack
          path: ${{ runner.temp }}/pack
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for a publish token
    steps:
      # Writes the .npmrc pointing at the npm registry, deliberately without
      # NODE_AUTH_TOKEN: a token in the environment would take precedence over
      # OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; pinned so the job never picks up a new npm on its own.
      - run: npm install --global --ignore-scripts npm@11.21.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack
          path: ${{ runner.temp }}/pack

      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: npm publish "$RUNNER_TEMP/pack/iron-session-$VERSION.tgz" --tag "$TAG" --provenance

      # The failure we care about is publishing without provenance, which looks
      # exactly like a success. Ask the registry what it actually stored. A new
      # version can take over a minute to show up, so poll for 5 minutes.
      - name: Verify the published version has provenance
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            url=$(curl -sf -H 'Cache-Control: no-cache' "https://registry.npmjs.org/iron-session/$VERSION" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).dist?.attestations?.url??"")}catch{}})' \
              || true)
            if [ -n "$url" ]; then
              echo "::notice::iron-session@$VERSION published with provenance: $url"
              exit 0
            fi
            echo "attempt $i: no attestation yet, waiting"
            sleep 10
          done
          echo "::error::iron-session@$VERSION has no provenance attestation after 5 minutes. Check the trusted publisher config on npmjs.com."
          exit 1
